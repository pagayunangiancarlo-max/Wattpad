
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Storybook Library</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

<header>
  <h2>Kwentong Pambata ni Boss Gi</h2>
  <nav>
    <a href="#home">Home</a>
    <a href="#library">Library</a>
    <a href="#about">About</a>
    <button id="themeBtn">Dark Mode</button>
  </nav>
</header>

<main>

  <section id="library" class="library">
    <h2>Our Story Collection</h2>
    <input id="searchInput" type="search"
      placeholder="Search title or genre...">
    <div id="bookGrid" class="book-grid"></div>
    <p id="noResults" hidden>No stories found.</p>
  </section>

  <section id="about" class="about">
    <h2>About This Website</h2>
    <p>This website lets readers explore and read short stories
    from different genres.</p>
  </section>
</main>

<footer>
  <p>© 2026 Storybook Library</p>
</footer>

</body>
</html>
